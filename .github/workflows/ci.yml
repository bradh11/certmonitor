# Main CI/CD Pipeline - Efficient testing and quality checks
name: CI/CD

on:
  push:
    branches: [main, develop]  # Only comprehensive tests on main branches
  pull_request:  # Every PR, including stacked PRs whose base is another feature branch
  release:
    types: [published]
  schedule:
    # Run security scans and the fuzz smoke test weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:  # lets the weekly jobs (fuzz smoke) be run by hand

# Prevent duplicate runs for PR pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast quality checks - runs on all triggers
  quick-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked --group dev
        
      - name: Check formatting
        run: uv run ruff format --check .
        
      - name: Lint with ruff
        run: uv run ruff check .
        
      - name: Install Rust extension
        run: make develop
        
      - name: Run quick tests (core functionality)
        run: |
          uv run pytest tests/test_core/test_initialization.py --maxfail=2 --disable-warnings

  # Comprehensive test suite - runs on PRs and main branch pushes
  test:
    runs-on: ubuntu-latest
    needs: quick-checks
    # Only run comprehensive tests on PRs and main/develop pushes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'release'
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]  # Full Python matrix
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked --group dev
        
      - name: Install Rust extension
        run: make develop
        
      - name: Run full test suite with coverage
        run: |
          uv run pytest --maxfail=2 --disable-warnings \
            --cov=certmonitor --cov-report=xml --cov-report=html
            
      - name: Upload coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: certmonitor-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Build verification (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          echo "🏗️ Verifying build..."
          make wheel
          echo "✅ Build verification complete"

  # Type checking and code quality - only on PRs and main branches
  quality:
    runs-on: ubuntu-latest
    needs: quick-checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked --group dev
        
      - name: Install Rust extension
        run: make develop
        
      - name: Run type checking with mypy
        run: |
          uv run mypy certmonitor/ --ignore-missing-imports --show-error-codes

      # FUTURE: consider running astral's `ty` type checker here once it
      # stabilizes (currently a 0.0.x preview). It is stricter than mypy
      # (e.g. on the validator override signatures), so it is not wired into
      # CI yet. Run it locally with `make typecheck-ty` to see its output.
      # - name: Type checking with ty (advisory, non-blocking)
      #   continue-on-error: true
      #   run: uvx ty check certmonitor/

      - name: Check code complexity
        run: |
          uv run radon cc certmonitor/ --min B
          uv run radon mi certmonitor/ --min B

  # Rust-specific checks - smart triggering
  rust:
    runs-on: ${{ matrix.os }}
    needs: quick-checks
    strategy:
      matrix:
        os: [ubuntu-latest]  # Only Linux for regular checks
        rust: ["1.98.1"]  # keep in sync with rust-toolchain.toml
        include:
          # Cross-platform only on PRs and releases
          - os: macos-latest
            rust: "1.98.1"
            if: github.event_name == 'pull_request' || github.event_name == 'release'
          - os: windows-latest
            rust: "1.98.1"
            if: github.event_name == 'pull_request' || github.event_name == 'release'
        
    # Run if Rust files changed OR it's a PR/main branch push OR it's a release
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      contains(github.event.head_commit.modified, 'rust_certinfo/') ||
      contains(github.event.head_commit.modified, 'Cargo.toml') ||
      contains(github.event.head_commit.modified, 'Cargo.lock') ||
      github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust_certinfo -> target"
          
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        
      - name: Run Rust tests
        run: cargo test --locked --verbose
        
      - name: Check security advisories
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  # Security scanning (weekly + on security-related changes)
  security:
    runs-on: ubuntu-latest
    # Run on develop/main pushes, PRs, weekly schedule, and releases
    if: |
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
      
    permissions:
      security-events: write
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked --group dev
        

      - name: Run bandit security linter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fail on PRs to catch issues early (using bandit config for exceptions)
            uv run bandit -r certmonitor/ -f json -o bandit-report.json -c .bandit
          else
            # Allow on main/develop since PR was already tested
            uv run bandit -r certmonitor/ -f json -o bandit-report.json -c .bandit || true
          fi
      
      - name: Review security findings
        run: |
          echo "🔍 Python security scan completed with bandit."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "⚠️  PR Security Check: Any blocking findings must be addressed or documented."
            echo "📋 Add exceptions to .bandit configuration if findings are intentional for this security tool."
          else
            echo "⚠️  Note: Some findings may be intentional for this security assessment tool."
            echo "📋 Review .bandit configuration for documented exceptions."
          fi

  # Documentation build - runs on PR merges and before releases
  docs:
    runs-on: ubuntu-latest
    # Only run on main/develop pushes (PR merges) and releases
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked --group docs
        
      - name: Build docs
        run: |
          uv run mkdocs build --strict

  wheels:
    needs: [test, quality, rust, security, docs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build portable abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: "1.98.1"  # keep in sync with rust-toolchain.toml
          maturin-version: "1.8.6"  # matches uv.lock
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: "2_28"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: "1.98.1"
          maturin-version: "1.8.6"
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.9"
      - name: Publish tested distributions to PyPI
        run: uv publish dist/*

  # Weekly fuzz smoke test: every libFuzzer target for 60 seconds. Needs
  # nightly Rust and cargo-fuzz, so it stays off the PR path; see
  # fuzz/README.md. A crash lands in fuzz/artifacts/ and fails the job.
  fuzz-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run every fuzz target for 60s
        run: make fuzz-all FUZZ_DURATION=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
